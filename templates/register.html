<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Ganga River Water Quality DSS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #0B132B 0%, #1C2541 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .auth-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .auth-header { text-align: center; margin-bottom: 1.75rem; }
        .auth-logo {
            width: 50px; height: 50px; background: linear-gradient(135deg, #00A896, #0284C7);
            border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;
            color: white; font-size: 1.5rem; margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo"><i class="fa-solid fa-user-plus"></i></div>
            <h2 style="font-size: 1.4rem; margin-bottom: 0.25rem;">Create Account</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Access Ganga River Water Quality DSS</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert-box {{ category | upper }}" style="font-size: 0.85rem;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-user"></i> Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="Dr. Rahul Verma" required>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="rahul@research.ac.in" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fa-solid fa-check"></i> Confirm</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-user-tag"></i> System Role</label>
                <select name="role" class="form-select">
                    <option value="Researcher">Researcher</option>
                    <option value="Environmental Analyst">Environmental Analyst</option>
                    <option value="Administrator">Administrator</option>
                </select>
            </div>

            <button type="submit" class="btn btn-teal" style="width: 100%; padding: 0.75rem;">
                <i class="fa-solid fa-user-check"></i> Register Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
            Already registered? <a href="{{ url_for('auth.login') }}" style="color: var(--ocean-cyan); font-weight: 600;">Sign in here</a>
        </div>
    </div>

</body>
</html>
